name: Manter Supabase ativo

# O plano gratuito do Supabase pausa o projeto depois de 7 dias sem uso.
# Este agendamento consulta o banco pelo site a cada 2 dias para evitar a pausa.
on:
  schedule:
    - cron: '17 12 */2 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar o banco pelo site
        run: |
          for i in 1 2 3; do
            if curl -fsS --max-time 30 https://sgengenharias.com/api/saude; then exit 0; fi
            sleep 20
          done
          echo "O banco não respondeu. Confira se o projeto está pausado no painel do Supabase."
          exit 1
